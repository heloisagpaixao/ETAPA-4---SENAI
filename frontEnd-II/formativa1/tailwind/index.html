<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FORMATIVA - Tailwind</title>

    <link rel="stylesheet" href="output.css" />
  </head>

  <body class="bg-gray-100">
    <header class="bg-red-600 text-center text-white py-4 mb-4">
        <h1 class="font-bold text-3xl">FORMATIVA - TAILWIND</h1>

    <main class="container">
      <div class="max-w-6xl mx-auto px-4">
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <article class="bg-gray-50 p-4 rounded-lg shadow-sm">
            <h3 class="font-bold">Feijoada</h3>
            <p>Apenas uma feijoada gostosa.</p>
          </article>

          <article class="bg-gray-50 p-4 rounded-lg shadow-sm">
            <h3 class="font-bold">Coxinha</h3>
            <p>Apenas uma coxinha gostosa.</p>
          </article>

          <article class="bg-gray-50 p-4 rounded-lg shadow-sm">
            <h3 class="font-bold">Brigadeiro</h3>
            <p>Apenas um brigadeiro gostoso.</p>
          </article>
        </section>
      </div>
    </main>
